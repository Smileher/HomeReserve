name: home_reserve
description: 离线家庭收入、储蓄与账户资产记录工具，支持 Android、Windows、macOS。
publish_to: none
version: 1.1.0+4
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.0.0
  flutter_riverpod: ^3.0.0
  drift: ^2.30.0
  sqlite3: ^3.1.0
  path: ^1.9.1
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  share_plus: ^13.0.0
  go_router: ^18.0.0
  fl_chart: ^1.1.1
  excel: ^4.0.6
  archive: ^3.6.1
  pdf: ^3.11.3
  crypto: ^3.0.6
  uuid: ^4.5.1
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
