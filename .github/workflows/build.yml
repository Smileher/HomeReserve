name: 检查、三端构建与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homereserve-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.50.1'
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow fonttools
      - run: python tool/bootstrap.py
      - run: flutter pub get
      - run: dart format lib test integration_test
      - run: dart fix --apply --code=curly_braces_in_flow_control_structures
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-source
          path: |
            android
            windows
            macos
            assets
            pubspec.lock
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formatted-source
          path: |
            lib
            test
            integration_test
            pubspec.lock
            analysis_options.yaml
          retention-days: 14
  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: android
          - os: windows-2025-vs2026
            platform: windows
          - os: macos-26
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      - name: Android SDK 准备
        if: matrix.platform == 'android'
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2"'
      - name: Android 正式签名与构建
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: homereserve
        run: |
          test -n "$KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/homereserve.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x android/gradlew
          flutter build apk --release --target-platform android-arm64
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/')}
          assert abis == {'arm64-v8a'}, f'Unexpected native architectures: {abis}'
          print('Native architecture verified: arm64-v8a')
          PY
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/HomeReserve-android-arm64.apk
      - name: Windows 构建
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory dist | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft C++ runtime directory not found' }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "build/windows/x64/runner/Release/$dll")) { throw "Missing runtime: $dll" }
          }
          Copy-Item README.md build/windows/x64/runner/Release/使用说明.md
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/HomeReserve-windows-x64.zip
      - name: macOS 构建与打包
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          flutter config --enable-macos-arm64-only
          flutter build macos --release
          mkdir -p dist dmg-root
          cp -R build/macos/Build/Products/Release/HomeReserve.app dmg-root/
          codesign --force --deep --preserve-metadata=entitlements --sign - dmg-root/HomeReserve.app
          codesign --verify --deep --strict dmg-root/HomeReserve.app
          ln -s /Applications dmg-root/Applications
          cp README.md dmg-root/使用说明.md
          hdiutil create -volname HomeReserve -srcfolder dmg-root -ov -format UDZO dist/HomeReserve-${{ matrix.platform }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
      - run: |
          mkdir dist
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.dmg' \) -exec cp {} dist/ \;
          test "$(find dist -type f | wc -l)" -eq 3
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
